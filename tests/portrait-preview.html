<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Portrait transition check</title><link rel="stylesheet" href="/style.css"><style>.avatar-strip{width:min(420px,65vw);height:100vh;display:block}.portrait{height:100%}nav{position:fixed;right:20px;top:30px;display:grid;gap:12px}button{padding:12px}output{color:white}</style></head><body><aside class="avatar-strip"><section class="portrait" data-player="1" data-jacket-off="/avatars/player-action-jacket-off.png" data-swimsuit="/avatars/player-action-bikini.png"><img src="/avatars/player.png" alt="Original calico portrait"></section></aside><nav><button data-count="100" data-reset="true">100 HP / new game</button><button data-count="59">59 HP / jacket off</button><button data-count="29">29 HP / bikini</button><button data-count="80">80 HP / heal</button><output>100 HP</output></nav><script type="module">
import {createPortraitController} from '/portraits.js';
import {portraitFlash,clearPortraitFlash} from '/portrait-effects.js';
const cache=new Map();const loadImage=src=>{if(!cache.has(src)){const i=new Image();i.src=src;cache.set(src,i.decode());}return cache.get(src);};
const update=createPortraitController({panels:[document.querySelector('.portrait')],loadImage,flash:portraitFlash,clearFlash:clearPortraitFlash,reducedMotion:()=>matchMedia('(prefers-reduced-motion:reduce)').matches});
for(const button of document.querySelectorAll('button'))button.onclick=async()=>{const count=Number(button.dataset.count);await update([100,count],{animate:!button.dataset.reset,reset:!!button.dataset.reset});document.querySelector('output').textContent=`${count} HP`;};
</script></body></html>
